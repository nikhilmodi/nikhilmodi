name: Update years of experience

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute years of experience since 2018-08-06
        run: |
          start_y=2018; start_m=08; start_d=06
          today_y=$(date +%Y); today_m=$(date +%m); today_d=$(date +%d)
          years=$((today_y - start_y))
          if (( 10#$today_m < 10#$start_m || (10#$today_m == 10#$start_m && 10#$today_d < 10#$start_d) )); then
            years=$((years - 1))
          fi
          sed -i -E "s/<!--yoe-->[0-9]+<!--\/yoe-->/<!--yoe-->${years}<!--\/yoe-->/" README.md

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update years of experience"
          file_pattern: README.md
